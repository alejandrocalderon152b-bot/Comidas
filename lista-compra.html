<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lista de la compra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: una columna de móvil con tres pestañas (Debe haber, Hay, Comprar); la tercera se calcula restando las dos primeras. */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --fg: #16231c;
  --muted: #5d6e64;
  --line: #dbe4de;
  --accent: #1f8a4c;
  --accent-fg: #ffffff;
  --done-bg: #e8f1ec;
  --danger: #b3261e;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1713; --surface: #18231d; --fg: #e6efe9; --muted: #93a79b;
    --line: #2a3a31; --accent: #4cc47f; --accent-fg: #07150d; --done-bg: #131d18; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1713; --surface: #18231d; --fg: #e6efe9; --muted: #93a79b;
  --line: #2a3a31; --accent: #4cc47f; --accent-fg: #07150d; --done-bg: #131d18; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 1.9rem; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.95rem; }
.progress { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.count { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

form { display: grid; grid-template-columns: 1fr 84px auto; gap: 8px; }
input[type=text], input[type=number] {
  min-width: 0; width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.add { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 0 18px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 0.85rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; }

.tabs { display: flex; gap: 6px; }
.tab { flex: 1; font: inherit; font-size: 0.9rem; font-weight: 500; color: var(--muted); background: transparent; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 6px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 4px; }
li.done { background: var(--done-bg); }
li label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 10px; cursor: pointer; }
li input[type=checkbox] { appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--muted); border-radius: 8px; display: grid; place-content: center; cursor: pointer; background: transparent; }
li input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
li input[type=checkbox]:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--accent-fg); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.name { overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meta { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.plain { flex: 1; min-width: 0; padding: 12px 6px 12px 12px; }
li.done .name { text-decoration: line-through; color: var(--muted); }
.qty { margin-left: auto; font-size: 0.85rem; color: var(--muted); background: var(--bg); border-radius: 99px; padding: 2px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.del { flex: none; width: 40px; height: 40px; font-size: 1.3rem; line-height: 1; color: var(--muted); background: transparent; border: 0; border-radius: 10px; cursor: pointer; }
.del:hover { color: var(--danger); }
.step { flex: none; display: flex; align-items: center; gap: 2px; background: var(--bg); border-radius: 99px; padding: 2px; }
.step button { width: 32px; height: 32px; font: inherit; font-size: 1.2rem; line-height: 1; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; }
.step button:disabled { opacity: .35; cursor: default; }
.step output { min-width: 26px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1.5px dashed var(--line); border-radius: 12px; }
.foot { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { font: inherit; font-size: 0.9rem; color: var(--fg); background: transparent; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.ghost.warn { color: var(--danger); }
</style>

<main>
  <header>
    <h1>Lista de la compra</h1>
    <p class="sub" id="fecha"></p>
  </header>

  <div class="tabs" role="group" aria-label="Pestañas">
    <button class="tab" data-t="necesito" aria-pressed="true">Debe haber</button>
    <button class="tab" data-t="tengo" aria-pressed="false">Hay</button>
    <button class="tab" data-t="comprar" aria-pressed="false">Comprar</button>
  </div>

  <p class="sub" id="ayuda"></p>

  <section class="progress" id="progreso" aria-label="Progreso" hidden>
    <div class="bar"><i id="barra"></i></div>
    <div class="count" id="contador"></div>
  </section>

  <form id="form" autocomplete="off">
    <input type="text" id="nombre" placeholder="Añadir alimento" aria-label="Alimento" required maxlength="60">
    <input type="number" id="cantidad" value="1" min="1" max="99" inputmode="numeric" aria-label="Cantidad">
    <button class="add" type="submit">Añadir</button>
  </form>

  <div class="chips" id="sugerencias" aria-label="Sugerencias"></div>

  <ul id="lista"></ul>

  <div class="foot" id="pie"></div>
</main>

<script>
(function () {
  var KEY = "lista-compra-v2", KEY1 = "lista-compra-v1";
  var items = [];          // { id, nombre, necesito, tengo, comprado }
  var tab = "necesito";
  var confirmar = false;
  var SUG = ["Leche", "Huevos", "Pan", "Arroz", "Pasta", "Tomates", "Pollo", "Fruta", "Aceite", "Café"];
  var AYUDA = {
    necesito: "Lo que tiene que haber siempre en casa.",
    tengo: "Lo que hay ahora mismo en casa.",
    comprar: "Lo que falta: debe haber menos lo que hay."
  };
  var PLACE = { necesito: "Alimento que debe haber", tengo: "Alimento que hay en casa" };

  function cargar() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(d)) return d; } catch (e) {}
    try {
      var v1 = JSON.parse(localStorage.getItem(KEY1));
      if (Array.isArray(v1)) return v1.map(function (i) {
        return { id: i.id, nombre: i.nombre, necesito: i.cantidad, tengo: i.comprado ? i.cantidad : 0, comprado: false };
      });
    } catch (e) {}
    return [
      { id: 1, nombre: "Leche", necesito: 4, tengo: 4, comprado: false },
      { id: 2, nombre: "Huevos", necesito: 6, tengo: 2, comprado: false },
      { id: 3, nombre: "Pan", necesito: 2, tengo: 0, comprado: false },
      { id: 4, nombre: "Tomates", necesito: 4, tengo: 1, comprado: false },
      { id: 5, nombre: "Arroz", necesito: 1, tengo: 3, comprado: false }
    ];
  }
  function guardar() {
    items = items.filter(function (i) { return i.necesito > 0 || i.tengo > 0; });
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  function falta(i) { return Math.max(0, i.necesito - i.tengo); }

  var $ = function (id) { return document.getElementById(id); };
  var ul = $("lista");

  function cambiar(it, campo, delta) {
    it[campo] = Math.max(0, Math.min(99, it[campo] + delta));
    it.comprado = false;
    guardar(); pintar();
  }
  function boton(txt, label, fn, off) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = txt;
    b.setAttribute("aria-label", label); b.disabled = !!off; b.addEventListener("click", fn); return b;
  }

  function fila(it) {
    var li = document.createElement("li");
    var n = document.createElement("span"); n.className = "name";
    var t = document.createElement("span"); t.textContent = it.nombre; n.appendChild(t);
    var m = document.createElement("span"); m.className = "meta";

    if (tab === "comprar") {
      var f = falta(it);
      if (it.comprado) li.className = "done";
      m.textContent = "Debe haber " + it.necesito + " · hay " + it.tengo;
      n.appendChild(m);
      var lb = document.createElement("label");
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = it.comprado;
      cb.setAttribute("aria-label", "Marcar " + it.nombre + " como comprado");
      cb.addEventListener("change", function () { it.comprado = cb.checked; guardar(); pintar(); });
      lb.appendChild(cb); lb.appendChild(n);
      var q = document.createElement("span"); q.className = "qty"; q.textContent = "Comprar " + f;
      li.appendChild(lb); li.appendChild(q);
      q.style.marginRight = "10px";
      return li;
    }

    var campo = tab;
    var otro = campo === "necesito" ? "hay " + it.tengo : "debe haber " + it.necesito;
    m.textContent = otro.charAt(0).toUpperCase() + otro.slice(1);
    n.appendChild(m);
    var p = document.createElement("div"); p.className = "plain"; p.appendChild(n);
    var st = document.createElement("div"); st.className = "step";
    var num = document.createElement("output"); num.textContent = it[campo];
    st.appendChild(boton("\u2212", "Restar una unidad de " + it.nombre, function () { cambiar(it, campo, -1); }));
    st.appendChild(num);
    st.appendChild(boton("+", "Sumar una unidad de " + it.nombre, function () { cambiar(it, campo, 1); }, it[campo] >= 99));
    var d = boton("\u00d7", "Quitar " + it.nombre + " de esta pestaña", function () { it[campo] = 0; it.comprado = false; guardar(); pintar(); });
    d.className = "del";
    li.appendChild(p); li.appendChild(st); li.appendChild(d);
    return li;
  }

  function pintar() {
    var enComprar = tab === "comprar";
    $("ayuda").textContent = AYUDA[tab];
    $("form").hidden = enComprar; $("sugerencias").hidden = enComprar;
    $("progreso").hidden = !enComprar;
    if (!enComprar) $("nombre").placeholder = PLACE[tab];

    var vis = items.filter(function (i) { return enComprar ? falta(i) > 0 : i[tab] > 0; });
    ul.innerHTML = "";
    if (!vis.length) {
      var e = document.createElement("li");
      e.className = "empty"; e.style.display = "block";
      e.textContent = enComprar
        ? (items.some(function (i) { return i.necesito > 0; }) ? "No te falta nada." : "Primero indica en «Debe haber» lo que necesitas.")
        : "Añade tu primer alimento arriba.";
      ul.appendChild(e);
    }
    vis.forEach(function (it) { ul.appendChild(fila(it)); });

    if (enComprar) {
      var hechos = vis.filter(function (i) { return i.comprado; }).length;
      $("barra").style.width = vis.length ? (hechos / vis.length * 100) + "%" : "0";
      $("contador").textContent = vis.length ? hechos + " de " + vis.length + " comprados" : "Nada pendiente";
    }

    var pie = $("pie"); pie.innerHTML = "";
    if (enComprar) {
      var b = document.createElement("button"); b.type = "button"; b.className = "ghost";
      b.textContent = "Pasar comprados a «Hay»";
      b.disabled = !items.some(function (i) { return i.comprado && falta(i) > 0; });
      b.addEventListener("click", function () {
        items.forEach(function (i) { if (i.comprado) { i.tengo = Math.min(99, i.tengo + falta(i)); i.comprado = false; } });
        guardar(); pintar();
      });
      pie.appendChild(b);
    } else {
      var v = document.createElement("button"); v.type = "button"; v.className = "ghost warn";
      v.textContent = confirmar ? "Pulsa otra vez para vaciar" : "Vaciar esta pestaña";
      v.addEventListener("click", function () {
        if (!confirmar) { confirmar = true; pintar(); setTimeout(function () { confirmar = false; pintar(); }, 3000); return; }
        items.forEach(function (i) { i[tab] = 0; i.comprado = false; });
        confirmar = false; guardar(); pintar();
      });
      pie.appendChild(v);
    }
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-pressed", t.dataset.t === tab); });
  }

  function anadir(nombre, cant) {
    nombre = nombre.trim();
    if (!nombre || tab === "comprar") return;
    var ya = items.find(function (i) { return i.nombre.toLowerCase() === nombre.toLowerCase(); });
    if (ya) { ya[tab] = Math.min(99, ya[tab] + cant); ya.comprado = false; }
    else { var o = { id: Date.now() + Math.random(), nombre: nombre, necesito: 0, tengo: 0, comprado: false }; o[tab] = cant; items.unshift(o); }
    guardar(); pintar();
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    anadir($("nombre").value, Math.max(1, parseInt($("cantidad").value, 10) || 1));
    $("nombre").value = ""; $("cantidad").value = 1; $("nombre").focus();
  });
  SUG.forEach(function (s) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = "+ " + s;
    b.addEventListener("click", function () { anadir(s, 1); });
    $("sugerencias").appendChild(b);
  });
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { tab = t.dataset.t; confirmar = false; pintar(); });
  });

  $("fecha").textContent = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  items = cargar();
  pintar();
})();
</script>

</body></html>
